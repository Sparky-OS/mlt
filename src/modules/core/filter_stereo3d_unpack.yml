schema_version: 7.0
type: filter
identifier: stereo3d_unpack
title: Stereoscopic 3D Unpack
version: 1
copyright: Daniel Campos Ramos
creator: Daniel Campos Ramos
license: LGPLv2.1
language: en
tags:
  - Video
description: >
  Takes the views out of a stereoscopic 3D video, whatever the packing of its frames (the frame packing arrangement
  types of H.264 Table D-8 and H.265 Table D.8, Matroska's StereoMode), and gives the left view, the right view or both
  side by side with the left one first. It asks for the full colour picture, so views that are interleaved at the pixel
  are not mixed by a conversion to a subsampled format. A frame sequence is paired from consecutive frames.
notes: >
  Meant for a consumer's preview, where nothing in the chain scales the picture before it gets here.
parameters:
  - identifier: packing
    argument: yes
    title: Packing
    type: string
    description: >
      side_by_side, top_and_bottom, frame_sequence, checkerboard, side_by_side_quincunx, lines or columns, as the
      avformat producer's meta.media.stereo3d.type names them. Nothing is changed without one.
    mutable: yes
  - identifier: invert
    title: Right eye first
    type: boolean
    default: 0
    mutable: yes
  - identifier: output
    title: Output
    type: string
    description: left, right, or side_by_side (both views, the left eye first)
    default: side_by_side
    mutable: yes
  - identifier: resource
    title: Frame sequence file
    type: string
    description: >
      For a frame sequence, the file the frames are read from, when the frames the filter gets are made of many clips (a project)
      and so do not say it. By default it is the resource of the frame's producer.
    mutable: yes
  - identifier: offset
    title: Position of the first frame
    type: integer
    description: With resource, the position in the filter's frames of the first frame of the file.
    default: 0
    mutable: yes
